[project]
name = "videoctx"
version = "0.1.5"
description = "Open, model-free video context layer for LLM agents: index once, query cheaply with any model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fred Dunyo" }]
dependencies = [
    "click>=8.1",
    "faster-whisper>=1.0",
    "scenedetect[opencv]>=0.6.4",
    "anthropic>=0.60",
    "pydantic>=2.7",
    "mcp>=2.0",
    # Security floor: certifi builds before 2026.10.19 trust the compromised
    # eMudhra emSign roots (PSF advisory, 2026-10-20). certifi is already a
    # transitive dependency (httpx via anthropic); this only floors it.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]
ocr = [
    "rapidocr-onnxruntime>=1.3",
]
eval = [
    "rapidocr-onnxruntime>=1.3",
    "datasets>=2.19",
    "google-genai>=1.0",
    "pandas>=2.0",
]

[project.scripts]
videoctx = "videoctx.cli:main"
videoctx-mcp = "videoctx.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoctx"]
