[project]
name = "videoctx"
version = "0.1.2"
description = "Open, model-free video context layer for LLM agents: index once, query cheaply with any model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fred Dunyo" }]
dependencies = [
    "click>=8.1",
    "faster-whisper>=1.0",
    "scenedetect[opencv]>=0.6.4",
    "anthropic>=0.60",
    "pydantic>=2.7",
    "mcp>=2.0",
]

[project.optional-dependencies]
eval = [
    "datasets>=2.19",
    "google-genai>=1.0",
    "pandas>=2.0",
]

[project.scripts]
videoctx = "videoctx.cli:main"
videoctx-mcp = "videoctx.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoctx"]
