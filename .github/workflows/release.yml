name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.13.4"
      - name: Version must match the tag
        run: |
          pkg=$(uvx --from toml-cli toml get --toml-path pyproject.toml project.version)
          [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "pyproject $pkg != tag ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "__version__ = \"$pkg\"" videoctx/__init__.py || { echo "__init__.py version mismatch"; exit 1; }
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
