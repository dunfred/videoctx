name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.13.4"
      - name: Version strings must agree (and match the tag on tag builds)
        run: |
          pkg=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          grep -q "__version__ = \"$pkg\"" videoctx/__init__.py || { echo "__init__.py version != pyproject ($pkg)"; exit 1; }
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "pyproject $pkg != tag ${GITHUB_REF_NAME}"; exit 1; }
          fi
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Only tag pushes publish; workflow_dispatch exercises the build half.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
